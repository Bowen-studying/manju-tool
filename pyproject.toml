[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "manju-tool"
version = "0.6.0"
description = "AI 漫剧制作 CLI — 从文字到分镜/配音/视频，一条命令"
authors = [
    {name = "manju", email = "manju@example.com"},
]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "openpyxl>=3.0",
    "python-docx>=1.0",
    "reportlab>=4.0",
    "edge-tts>=7.0",
    "Pillow>=10.0",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-sqlite>=3.1,<4",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
    "Topic :: Artistic Software",
]

[project.urls]
Homepage = "https://github.com/Bowen-studying/manju-tool"
Repository = "https://github.com/Bowen-studying/manju-tool"
Issues = "https://github.com/Bowen-studying/manju-tool/issues"

[project.optional-dependencies]
test = ["pytest>=8,<9"]
planner = ["ortools==9.14.6206"]

[project.scripts]
manju = "manju.cli:main"
manju-provider-worker = "manju.production.manual_worker:main"

[tool.setuptools.packages.find]
include = ["manju*"]

[tool.setuptools.package-data]
"manju.knowledge" = ["production_playbook.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
